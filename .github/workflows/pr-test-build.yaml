name: Pull Request Test Build
on:
  pull_request:
    branches:
      - main
jobs:
  Build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Apply fork patches
        shell: pwsh
        run: |
          ./scripts/Apply-ForkPatches.ps1
          ./scripts/Apply-ForkStatusPatches.ps1
          ./scripts/Apply-ForkGatherLoopGuardPatches.ps1
          ./scripts/Apply-ForkSupplyPlanPatches.ps1
          ./scripts/Apply-ForkSupplyPreferencePatches.ps1

      - name: Verify fork status patches
        shell: pwsh
        run: |
          $queue = Get-Content ./GatherBuddy/Crafting/CraftingQueueProcessor.cs -Raw
          $bridge = Get-Content ./GatherBuddy/Crafting/CraftingGatherBridge.cs -Raw
          $status = Get-Content ./GatherBuddy/Gui/CraftingStatusWindow.cs -Raw
          $support = Get-Content ./GatherBuddy/Crafting/ForkVulcanWorkflowSupport.cs -Raw
          $supply = Get-Content ./GatherBuddy/Crafting/ForkVulcanSupplyPlan.cs -Raw
          $config = Get-Content ./GatherBuddy/Config/Configuration.cs -Raw
          if ($queue -notmatch 'WaitingForManualMaterials' -or $queue -notmatch 'HasUsefulRetainerWork') {
            throw 'Queue status/retainer preflight patch missing.'
          }
          if ($bridge -notmatch 'BuildGatherPlanSummary' -or $bridge -notmatch 'WaitingForManualMaterials') {
            throw 'Gather plan/manual resume patch missing.'
          }
          if ($bridge -notmatch 'TryAddAutoGatherTarget' -or $bridge -notmatch 'TryRegisterGatherRecovery') {
            throw 'Real-node filtering or bounded gather recovery patch missing.'
          }
          if ($bridge -notmatch 'ForkVulcanSupplyPlan.ShouldUseVendor') {
            throw 'Supply preference is not wired into the crafting bridge.'
          }
          if ($status -notmatch 'Gathering materials' -or $status -notmatch 'Manual materials acquired') {
            throw 'Live Crafting Status patch missing.'
          }
          if ($status -notmatch 'Gather first \(free\)' -or $status -notmatch 'Vendors first \(faster\)') {
            throw 'Supply preference selector missing.'
          }
          if ($support -notmatch 'NodeList.Count > 0' -or $support -notmatch 'MaxUnchangedGatherRecoveries') {
            throw 'Gather location validation or loop guard support missing.'
          }
          if ($support -notmatch 'ForkVulcanSupplyPlan.ShouldUseVendor') {
            throw 'Choice-aware source classification missing.'
          }
          if ($supply -notmatch 'VulcanSupplyPreference' -or $supply -notmatch 'HasDualSource') {
            throw 'Dual-source supply policy missing.'
          }
          if ($config -notmatch 'VulcanSupplyPreference.*GatherFirst') {
            throw 'Persistent GatherFirst default missing.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud Latest
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore Nuget Packages
        run: dotnet restore Gatherbuddy/Gatherbuddy.csproj

      - name: Build Plugin
        run: dotnet build --no-restore -c Release Gatherbuddy/Gatherbuddy.csproj --output .\build
      - name: Build raphael-cli from raphael-rs
        run: |
          git clone https://github.com/KonaeAkira/raphael-rs.git raphael-rs-temp
          cd raphael-rs-temp
          cargo build --release --package raphael-cli
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Error: Failed to build raphael-cli"
            exit 1
          }
          Copy-Item -Path ".\target\release\raphael-cli.exe" -Destination "..\build\raphael-cli.exe" -Force
          cd ..
          Remove-Item -Recurse -Force raphael-rs-temp
          Write-Host "Successfully built and copied raphael-cli.exe"
